<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ankh Do — Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="card">
    <header class="head">
      <span class="emblem" id="emblem"></span>
      <h1>Ankh Do</h1>
    </header>
    <section>
      <h2>Appearance</h2>
      <label class="row" for="light">
        <span class="text">
          <span class="title">Off-white theme</span>
          <span class="sub">A light papyrus look instead of night lapis</span>
        </span>
        <input type="checkbox" id="light" role="switch">
        <span class="switch" aria-hidden="true"></span>
      </label>
    </section>
  </main>
  <script src="glyphs.js"></script>
  <script src="options.js"></script>
</body>
</html>
